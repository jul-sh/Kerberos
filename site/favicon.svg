<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Kerberos in black on a clear ground: the heads and shoulders are the mask's white,
         the eyes and the middle nose are cut out of them in its black -->
    <mask id="kerberos" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g fill="#fff">
        <!-- right head, in profile, looking up and out; its neck curves into the shoulders -->
        <path id="r" d="M42.5 23.5 C42.8 20 43.6 16.5 45 13 L48.6 18.6 C50 18.5 51.4 18.9 52.6 19.6 L60.4 22.4 C61.6 22.8 61.9 24.2 61 25 L59.2 26.3 L54.6 26.6 L56.6 28 L51.8 29.6 C50.4 31 49.6 33 49.4 35.4 C49.2 38.5 50 41.5 51.5 44 L39 47 C40.2 42 40.6 37 40.8 32 C40.9 29 41.6 26 42.5 23.5 Z"/>
        <use href="#r" transform="matrix(-1 0 0 1 64 0)"/>
        <!-- middle head, facing out: tall ears, a long muzzle -->
        <path d="M32 37.5 C30.4 37.5 29.6 36.4 29.2 35 C28.6 32.5 27.6 29.5 26.8 26.5 C26.2 24 26.2 21 26.6 18.5 L25.8 7.5 L30.2 13.6 C31.4 13.3 32.6 13.3 33.8 13.6 L38.2 7.5 L37.4 18.5 C37.8 21 37.8 24 37.2 26.5 C36.4 29.5 35.4 32.5 34.8 35 C34.4 36.4 33.6 37.5 32 37.5 Z"/>
        <path d="M29.4 34 L34.6 34 C35.5 38 36.4 41.5 38 45 L26 45 C27.6 41.5 28.5 38 29.4 34 Z"/>
        <!-- shoulders -->
        <path d="M12 59 C12.5 49 20 43.5 32 43.5 C44 43.5 51.5 49 52 59 Z"/>
      </g>
      <g fill="#000">
        <!-- eyes -->
        <path d="M28.6 21.6 L31 22.6 L28.9 23.4 Z"/>
        <path d="M35.4 21.6 L33 22.6 L35.1 23.4 Z"/>
        <circle cx="51.2" cy="22.2" r="1.1"/>
        <circle cx="12.8" cy="22.2" r="1.1"/>
        <!-- nose of the middle head -->
        <ellipse cx="32" cy="35.8" rx="1.7" ry="1.1"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#000" mask="url(#kerberos)"/>
</svg>
